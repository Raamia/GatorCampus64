<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate · Super Gatorlator 64</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <!-- Typed the in-game URL on the wrong host? Send the device code on to Auth0's activation page. -->
  <script>
    (function () {
      var code = new URLSearchParams(location.search).get("user_code");
      location.replace("https://login.chooseyourgator.select/activate" + (code ? "?user_code=" + encodeURIComponent(code) : ""));
    })();
  </script>
</head>
<body><main><p>Taking you to <a href="https://login.chooseyourgator.select/activate">login.chooseyourgator.select/activate</a>…</p></main></body>
</html>
